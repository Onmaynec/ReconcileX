secrets:
  db_password:
    file: ${DB_PASSWORD_FILE:?set_DB_PASSWORD_FILE}
  jwt_secret:
    file: ${JWT_SECRET_FILE:?set_JWT_SECRET_FILE}
  s3_access_key:
    file: ${S3_ACCESS_KEY_FILE:?set_S3_ACCESS_KEY_FILE}
  s3_secret_key:
    file: ${S3_SECRET_KEY_FILE:?set_S3_SECRET_KEY_FILE}
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
  silo:
    environment:
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_key
    secrets: [s3_access_key, s3_secret_key]
  init-storage:
    environment:
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    secrets: [s3_access_key, s3_secret_key]
  migrate:
    environment:
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET: ""
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    secrets: [db_password, jwt_secret, s3_access_key, s3_secret_key]
  api:
    environment:
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET: ""
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    secrets: [db_password, jwt_secret, s3_access_key, s3_secret_key]
  worker:
    environment:
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET: ""
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    secrets: [db_password, jwt_secret, s3_access_key, s3_secret_key]
  backup:
    environment:
      PGPASSWORD: ""
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/db_password
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    secrets: [db_password, s3_access_key, s3_secret_key]
