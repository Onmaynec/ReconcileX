# Optional TLS-only reverse proxy. Requires valid user-provisioned cert files:
# ./certs/fullchain.pem and ./certs/privkey.pem. Do not publish the API itself.
# Keep the proxy IP aligned with TLS_PROXY_IP and TRUSTED_PROXY_CIDRS in .env.
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 21m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    # Overwrite, never append to, client-supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;

    # Per-originating-IP throttle. The application also keeps its independent
    # username + client-IP database window for requests reaching the API.
    location = /api/v1/auth/token {
        limit_req zone=auth_per_ip burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
    }

    location / {
        proxy_pass http://api:8000;
    }
}
