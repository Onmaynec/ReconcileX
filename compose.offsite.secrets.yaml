secrets:
  offsite_s3_access_key:
    file: ${OFFSITE_S3_ACCESS_KEY_FILE:?set_OFFSITE_S3_ACCESS_KEY_FILE}
  offsite_s3_secret_key:
    file: ${OFFSITE_S3_SECRET_KEY_FILE:?set_OFFSITE_S3_SECRET_KEY_FILE}
  offsite_manifest_hmac_key:
    file: ${OFFSITE_MANIFEST_HMAC_KEY_FILE:?set_OFFSITE_MANIFEST_HMAC_KEY_FILE}
services:
  backup:
    environment:
      OFFSITE_S3_ACCESS_KEY: ""
      OFFSITE_S3_SECRET_KEY: ""
      OFFSITE_MANIFEST_HMAC_KEY: ""
      OFFSITE_S3_ACCESS_KEY_FILE: /run/secrets/offsite_s3_access_key
      OFFSITE_S3_SECRET_KEY_FILE: /run/secrets/offsite_s3_secret_key
      OFFSITE_MANIFEST_HMAC_KEY_FILE: /run/secrets/offsite_manifest_hmac_key
    secrets:
      - offsite_s3_access_key
      - offsite_s3_secret_key
      - offsite_manifest_hmac_key
