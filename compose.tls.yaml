services:
  tls-proxy:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
    volumes:
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api: {condition: service_started}
    restart: unless-stopped
    networks:
      backend:
        ipv4_address: ${TLS_PROXY_IP:-172.29.240.10}
